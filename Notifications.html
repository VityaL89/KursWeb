<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications</title>
    <link rel="stylesheet" href="CategoriesStyle.css">
    <link rel="stylesheet" href="NotificationsStyle.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
</head>
<body>

<div id="site-header"></div>

<main>
    <section class="categories-banner">
        <div class="container categories-banner-container">
            <a href="index.html" class="back-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </a>
            <h1 class="categories-banner-title">Notifications</h1>
        </div>
    </section>

    <section class="notifications-section">
        <div class="container">
            <div class="notifications-card">
                <h2 class="notifications-title">Manage notifications</h2>
                <p class="notifications-subtitle">Choose what updates you want to receive.</p>

                <div class="notifications-list">
                    <label class="notification-toggle">
                        <span class="notification-toggle-text">Discounts</span>
                        <input type="checkbox" id="notif-discounts">
                        <span class="toggle-ui"></span>
                    </label>

                    <label class="notification-toggle">
                        <span class="notification-toggle-text">Promotions</span>
                        <input type="checkbox" id="notif-promotions">
                        <span class="toggle-ui"></span>
                    </label>

                    <label class="notification-toggle">
                        <span class="notification-toggle-text">New restaurants</span>
                        <input type="checkbox" id="notif-new-restaurants">
                        <span class="toggle-ui"></span>
                    </label>
                </div>

                <div class="notifications-actions">
                    <button class="notifications-btn" id="notif-save" type="button">Save</button>
                </div>

                <div class="notifications-status" id="notif-status" aria-live="polite"></div>
            </div>
        </div>
    </section>
</main>

<div id="site-footer"></div>

<script src="JavaScript/layout.js"></script>
<script src="JavaScript/auth.js"></script>
<script src="JavaScript/cart.js"></script>
<script src="JavaScript/notifications.js"></script>

</body>
</html>
