<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RestaurantDetail</title>
    <link rel="stylesheet" href="RestaurantDetailStyle.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="#" class="logo">
                <img src="images/Logo.png" alt="MealDrop Logo" class="logo-icon">
                <span>MealDrop</span>
            </a>

            <nav class="nav-wrapper">
                <ul class="nav-links">
                    <li><a href="#" class="nav-home">Home</a></li>
                    <li><a href="#" class="nav-all">All restaurants</a></li>
                </ul>

                <button class="nav-cart">
                    <img src="images/ShoppingCart.png" alt="Cart" class="cart-icon">
                    <span class="cart-text">Order</span>
                    <span class="cart-total">€ 8</span>
            </button>
            </nav>
        </div>
    </header>

    <main>
        <section class="Detail-banner">
        <div class="container Detail-banner-container">
            <h1 class="Detail-banner-title">restaurant.name</h1>
        </div>
    </section>
    </main>
</body>
</html>
