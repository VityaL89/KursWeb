<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading</title>
    <link rel="stylesheet" href="LoadingPageStyle.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
</head>
<body>
     <header class="header">
        <div class="container">
            <a href="#" class="logo">
                <img src="images/Logo.png" alt="MealDrop Logo" class="logo-icon">
                <span>MealDrop</span>
            </a>

            <nav class="nav-wrapper">
                <ul class="nav-links">
                    <li><a href="#" class="nav-home">Home</a></li>
                    <li><a href="#" class="nav-all">All restaurants</a></li>
                </ul>

                <button class="nav-cart">
                    <img src="images/ShoppingCart.png" alt="Cart" class="cart-icon">
                </button>
            </nav>
        </div>
    </header>

    <main>
       <div class="loading-spinner">

        <p class="loading-text">Looking for some food…</p>

        <div class="pacman-row">
            <div class="pacman"></div>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>

        </div>
    </main>

<footer class="footer">
    <div class="container">
        <div class="footer-content">
            
            <div class="footer-logo">
                <a href="#">
                    <img src="images/logoFooter.png" alt="MealDrop Logo" class="footer-logo-img">
                </a>
            </div>

            <div class="footer-nav">
                
                <div class="footer-column">
                    <h4 class="footer-col-title">Discover us</h4>
                    <ul class="footer-links">
                        <li><a href="#">Home</a></li>
                        <li><a href="#">Categories</a></li>
                        <li><a href="#">About</a></li>
                    </ul>
                </div>

                <div class="footer-column">
                    <h4 class="footer-col-title">Our social media</h4>
                    <ul class="footer-links">
                        <li><a href="#">Facebook</a></li>
                        <li><a href="#">Instagram</a></li>
                        <li><a href="#">Twitter</a></li>
                    </ul>
                </div>

                <div class="footer-column">
                    <h4 class="footer-col-title">Check our apps</h4>
                    <ul class="footer-links">
                        <li><a href="#">Link</a></li>
                        <li><a href="#">Link</a></li>
                    </ul>
                </div>

            </div>
        </div>
    </div>
</footer>

</body>
</html>
