<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | MealDrop</title>
    <link rel="stylesheet" href="SignUpStyle.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
</head>
<body>

<div id="site-header"></div>

<main>
    <section class="signup-banner">
        <div class="signup-banner-container">
            <h1 class="signup-banner-title">Join the MealDrop family</h1>
        </div>
    </section>

    <section class="signup-section">
        <div class="container">
            <div class="signup-wrapper">
                <div class="signup-card">
                    <div class="signup-header">
                        <h2>Create an account</h2>
                        <p>Already have an account? <a href="Login.html">Sign in</a></p>
                    </div>

                    <form class="signup-form" id="signupForm">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="firstName">First name</label>
                                <input type="text" id="firstName" name="firstName" placeholder="Din" required>
                            </div>
                            <div class="form-group">
                                <label for="lastName">Last name</label>
                                <input type="text" id="lastName" name="lastName" placeholder="Djarin" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="email">Email address</label>
                            <input type="email" id="email" name="email" placeholder="your@email.com" required>
                        </div>

                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" placeholder="••••••••" required>
                        </div>

                        <div class="form-group">
                            <label for="confirmPassword">Confirm password</label>
                            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required>
                        </div>

                        <div class="form-group checkbox-group">
                            <input type="checkbox" id="terms" name="terms" required>
                            <label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
                        </div>

                        <button type="submit" class="btn-create-account" id="signupBtn">Create account</button>
                    </form>
                </div>
            </div>
        </div>
    </section>
</main>
<div id="site-footer"></div>

<script src="JavaScript/layout.js"></script>
<script src="JavaScript/auth.js"></script>
<script src="JavaScript/cart.js"></script>
<script>
    document.getElementById('signupForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const firstName = document.getElementById('firstName').value.trim();
        const lastName = document.getElementById('lastName').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const terms = document.getElementById('terms').checked;
        
        if (password !== confirmPassword) {
            alert('Passwords do not match');
            return;
        }
        
        if (!terms) {
            alert('You must agree to the Terms of Service');
            return;
        }
        
        const result = await registerUser(firstName, lastName, email, password, 'user');
        
        if (result.success) {
            if (result.user?.role === 'admin') {
                window.location.href = 'AdminPanel.html';
            } else {
                alert('Account created successfully! Please sign in.');
                window.location.href = 'Login.html';
            }
        } else {
            alert(result.message);
        }
    });
</script>

</body>
</html>
