<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CategoriesNoFood</title>
    <link rel="stylesheet" href="CategoriesChildNoFoodStyle.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
</head>
<body>

    <header class="header">
        <div class="container">
            <a href="#" class="logo">
                <img src="images/Logo.png" alt="MealDrop Logo" class="logo-icon">
                <span>MealDrop</span>
            </a>

            <nav class="nav-wrapper">
                <ul class="nav-links">
                    <li><a href="#" class="nav-home">Home</a></li>
                    <li><a href="#" class="nav-all">All restaurants</a></li>
                </ul>

                <button class="nav-cart">
                    <img src="images/ShoppingCart.png" alt="Cart" class="cart-icon">
                </button>
            </nav>
        </div>
    </header>

<main>

    <section class="categoriesChildNoFood-banner">
        <div class="container categories-banner-container">
            <h1 class="categories-banner-title">No restaurants</h1>
        </div>
    </section>

    <section class="no-restaurant">
    <div class="container">
        <div class="breadcrumb">
                <a href="#" class="breadcrumb-link">categories</a> / no restaurant
        </div>

        <div class="no-restaurant-content">
            <h1 class="no-restaurant-title">This is not the food you're looking for.</h1>
            
            <img src="images/SushiEmpty.png" alt="No food" class="no-restaurant-img">
            
            <p class="no-restaurant-text">There seems that there are no restaurants in this category yet. Try to come back later?</p>
            
            <button class="no-restaurant-btn">See all restaurants</button>
        </div>
    </div>
</section>

</main>    
</body>
</html>
