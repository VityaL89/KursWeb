<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MealDrop</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="#" class="logo">
                <img src="images/Logo.png" alt="MealDrop Logo" class="logo-icon">
                <span>MealDrop</span>
            </a>

            <nav class="nav-wrapper">
                <ul class="nav-links">
                    <li><a href="#" class="nav-home">Home</a></li>
                    <li><a href="#" class="nav-all">All restaurants</a></li>
                </ul>

                <button class="nav-cart">
                    <img src="images/ShoppingCart.png" alt="Cart" class="cart-icon">
                </button>
            </nav>
        </div>
    </header>

    <main>
    <div class="main-banner">
    <div class="banner-content">
        <h1 class="main-banner-title">
            Hungry? <span> Find your next meal</span>
        </h1>
        <button class="main-banner-btn">See all restaurants</button>
    </div>
    </div>
</main>
</body>
</html>
