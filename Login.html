<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MealDrop</title>
    <link rel="icon" href="images/Logo.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="768pxAdaptive/768PxIndex.css">
    <link rel="stylesheet" href="360px.css">
    <link rel="stylesheet" href="mobile-menu.css">
    <link rel="stylesheet" href="LoginStyle.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
</head>
<body>

<div id="site-header"></div>

<main>
    <section class="login-banner">
        <div class="login-banner-container">
            <h1 class="login-banner-title">Welcome back</h1>
        </div>
    </section>

    <section class="login-section">
        <div class="container">
            <div class="login-wrapper">
                <div class="login-card">
                    <div class="login-header">
                        <h2>Sign in to your account</h2>
                        <p>Don't have an account? <a href="SignUp.html">Create one</a></p>
                    </div>

                    <form class="login-form" id="loginForm">
                        <div class="form-group">
                            <label for="email">Email address</label>
                            <input type="email" id="email" name="email" placeholder="your@email.com" required>
                        </div>

                        <div class="form-group">
                            <div class="password-header">
                                <label for="password">Password</label>
                                <a href="#" class="forgot-link">Forgot password?</a>
                            </div>
                            <input type="password" id="password" name="password" placeholder="••••••••" required>
                        </div>

                        <div class="form-group checkbox-group">
                            <input type="checkbox" id="remember" name="remember">
                            <label for="remember">Remember me</label>
                        </div>

                        <button type="submit" class="btn-login" id="loginBtn">Sign in</button>
                    </form>
                    
                    <div class="demo-accounts" style="margin-top: 24px; padding-top: 20px; border-top: 1px solid #F0F0F0; text-align: center;">
                        <p style="font-family: 'Hind', sans-serif; font-size: 14px; color: #6B7280;">Demo accounts:</p>
                        <p style="font-family: 'Hind', sans-serif; font-size: 13px; color: #9CA3AF;">
                            Admin: admin@mealdrop.com / admin123<br>
                            User: john@example.com / password123
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>

<div id="site-footer"></div>

<script src="JavaScript/layout.js"></script>
<script src="JavaScript/auth.js"></script>
<script src="JavaScript/cart.js"></script>
<script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        
        const result = await loginUser(email, password);
        
        if (result.success) {
            window.location.href = result.user?.role === 'admin' ? 'AdminPanel.html' : 'index.html';
        } else {
            alert(result.message);
        }
    });
</script>

</body>
</html>
