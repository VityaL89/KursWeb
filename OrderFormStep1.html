<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrderForm1</title>
    <link rel="icon" href="images/Logo.png" type="image/png">
    <link rel="stylesheet" href="OrderFormStyleStep1.css">
    <link rel="stylesheet" href="768pxAdaptive/768PxStep1.css">
    <link rel="stylesheet" href="360PxStep1.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
</head>
<body>
    
    <header class="header">
        <div class="container">
            <a href="#" class="logo">
                <img src="images/Logo.png" alt="MealDrop Logo" class="logo-icon">
                <span>MealDrop</span>
            </a>
        </div>
    </header>

<main class="checkout-page">

    <section class="checkout-banner">
        <div class="container">
            <h1 class="checkout-title">Your order at restaurant.name</h1>
        </div>
    </section>

    <div class="container">
        <div class="checkout-content">
            <div class="contact-section">
                <div class="contact-header">
                    <h2 class="contact-title">Contact details</h2>
                    <span class="step-indicator">Step 1 of 3</span>
                </div>

                <div class="progress-bar">
                    <div class="progress-bar-active"></div>
                    <div class="progress-bar-inactive"></div>
                </div>

                <form class="contact-form">
                    

                    <div class="form-row">
                        <div class="form-group form-group-first-name">
                            <label class="label-first-name" for="firstName">First name</label>
                            <input class="input-first-name" type="text" id="firstName" name="firstName" placeholder="Mando">
                        </div>

                        <div class="form-group form-group-last-name">
                            <label class="label-last-name" for="lastName">Last name</label>
                            <input class="input-last-name" type="text" id="lastName" name="lastName" placeholder="Lorian">
                        </div>
                    </div>

                    <div class="form-group form-group-email">
                        <label class="label-email" for="email">Email address</label>
                        <input class="input-email" type="email" id="email" name="email" placeholder="your@email.com">
                    </div>

                    <div class="form-group form-group-phone">
                        <label class="label-phone" for="phone">Phone number (optional)</label>
                        <input class="input-phone" type="tel" id="phone" name="phone" placeholder="+375 29 591 62 70">
                        <span class="form-note">We'll only use your phonenumber to call you about your order</span>
                    </div>

                    <button type="submit" class="btn-next">Next step</button>
                </form>
            </div>
            
            <div class="order-summary">
                <h3 class="order-title">Your order</h3>

                <div class="order-items">
                    <div class="order-item">
                        <span class="item-qty">1</span>
                        <span class="item-name">Dishname</span>
                        <span class="item-price">€ 8,50</span>
                    </div>

                    <div class="order-item">
                        <span class="item-qty">1</span>
                        <span class="item-name">Dishname</span>
                        <span class="item-price">€ 8,50</span>
                    </div>
                </div>

                <div class="order-total">
                    <span class="total-label">Total</span>
                    <span class="total-price">€ 8,50</span>
                </div>
            </div>
            
        </div> 
    </div> 
</main>

<script src="JavaScript/layout.js"></script>

<script src="JavaScript/auth.js"></script>
<script src="JavaScript/cart.js"></script>
<script src="JavaScript/order-form-step1.js"></script>
</body>
</html>
