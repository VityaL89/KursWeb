<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories</title>
    <link rel="stylesheet" href="CategoriesStyle.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="#" class="logo">
                <img src="images/Logo.png" alt="MealDrop Logo" class="logo-icon">
                <span>MealDrop</span>
            </a>

            <nav class="nav-wrapper">
                <ul class="nav-links">
                    <li><a href="#" class="nav-home">Home</a></li>
                    <li><a href="#" class="nav-all">All restaurants</a></li>
                </ul>

                <button class="nav-cart">
                    <img src="images/ShoppingCart.png" alt="Cart" class="cart-icon">
                </button>
            </nav>
        </div>
    </header>

<main>
    <section class="categories-banner">
        <div class="container categories-banner-container">
            <h1 class="categories-banner-title">Categories</h1>
        </div>
    </section>

    <section class="menu-section">
        <div class="container">
            <div class="menu-header">
                <h2 class="menu-title">What's on the menu?</h2>
                <p class="menu-subtitle">Whatever you're craving - we'll deliver it to your door. Feel like having pizza, sushi or your favourite dish from Tatooine? Explore your possibilities below.</p>
            </div>

            <div class="menu-grid">
                <div class="menu-card">
                    <img src="images/CategoriesPizza.png" alt="Pizza" class="menu-img">
                    <span class="menu-label">Pizza</span>
                </div>

                <div class="menu-card">
                    <img src="images/CategoriesBurgers.png" alt="Burgers" class="menu-img">
                    <span class="menu-label">Burgers</span>
                </div>

                <div class="menu-card">
                    <img src="images/CategoriesDesserts.png" alt="Desserts" class="menu-img">
                    <span class="menu-label">Desserts</span>
                </div>

                <div class="menu-card">
                    <img src="images/CategoriesSushi.png" alt="Sushi" class="menu-img">
                    <span class="menu-label">Sushi</span>
                </div>

                <div class="menu-card">
                    <img src="images/CategoriesAsian.png" alt="Asian" class="menu-img">
                    <span class="menu-label">Asian</span>
                </div>

                <div class="menu-card">
                    <img src="images/CategoriesComfort.png" alt="Comfort" class="menu-img">
                    <span class="menu-label">Comfort</span>
                </div>
            </div>
        </div>
    </section>
</main>
</body>
</html>
