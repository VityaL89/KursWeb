<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinalOrder</title>
    <link rel="stylesheet" href="FinalOrderStyle3.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
</head>
<body>
    
    <header class="header">
        <div class="container">
            <a href="#" class="logo">
                <img src="images/Logo.png" alt="MealDrop Logo" class="logo-icon">
                <span>MealDrop</span>
            </a>
        </div>
    </header>

<main>

    <section class="FinalOrder-banner">
        <div class="FinalOrder-banner-container">
            <h1 class="FinalOrder-banner-title">Order confirmed!</h1>
        </div>
    </section>

    <div class="container confirmed-container">
        
        <div class="delivery-info">
            <span class="delivery-label">Estimated delivery</span>
            <div class="delivery-time">13:23 today</div>
        </div>

        <div class="order-summary-card">
            <h3 class="card-title">Your order</h3>
            
            <div class="card-items">
 
                <div class="item-row">
                    <span class="item-qty">1</span>
                    <span class="item-name">Dishname</span>
                    <span class="item-price">€ 8,50</span>
                </div>

                <div class="item-row">
                    <span class="item-qty">1</span>
                    <span class="item-name">Dishname</span>
                    <span class="item-price">€ 8,50</span>
                </div>
            </div>

            <div class="card-total">
                <span class="total-label">Total</span>
                <span class="total-price">€ 8,50</span>
            </div>
        </div>

        <div class="illustration-block">
            <img src="images/FinalOrder.png" alt="Happy customers eating" class="bottom-illustration">
        </div>

    </div>

</main>    

</body>
</html>
